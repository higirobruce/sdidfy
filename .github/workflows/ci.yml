name: CI

# Pull-request and push CI for the SDID Auth Bridge.
#
# It runs the quickstart documented in README.md, in the same order, against
# the same service versions and credentials as .env.example — so a green run
# here means the instructions we hand a new engineer actually work:
#
#     pnpm install → pnpm build → pnpm db:migrate → pnpm test → pnpm demo:ghost-login
#
# Three jobs, cheapest first:
#   guards        no install at all — the non-negotiables scan and the secret
#                 scan, so an obviously bad change fails in under a minute.
#   verify        the real thing: typecheck, build, the full suite (including
#                 the e2e ghost-login suite) and the narrated demo as a smoke.
#   db-integrity  migrations against an empty database, plus proof that the
#                 audit append-only triggers actually reject UPDATE/DELETE.
#
# Dependency and SAST scanning live in .github/workflows/security.yml.

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

# One in-flight run per branch; a new push supersedes the old run.
concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

defaults:
  run:
    shell: bash

env:
  # Turborepo phones home and prints a first-run notice otherwise.
  TURBO_TELEMETRY_DISABLED: '1'
  DO_NOT_TRACK: '1'

jobs:
  # ---------------------------------------------------------------------------
  # Fast, dependency-free checks. Deliberately has no `needs:` so it runs in
  # parallel with the heavy jobs rather than gating them — a reviewer wants to
  # see both results.
  # ---------------------------------------------------------------------------
  guards:
    name: guards (non-negotiables + secrets)
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'

      # Backstop for the biometric / raw-NID / append-only rules in
      # docs/SPEC.md (10 "Non-negotiables", 07 §1/§3/§4). Zero dependencies.
      # Read the header of the script for what it does NOT catch.
      - name: Non-negotiables guard
        run: node .github/scripts/guard-non-negotiables.mjs

      - name: Secret scan
        run: bash .github/scripts/secret-scan.sh

  # ---------------------------------------------------------------------------
  # The documented quickstart, end to end.
  # ---------------------------------------------------------------------------
  verify:
    name: typecheck · build · test · ghost-login demo
    runs-on: ubuntu-latest
    timeout-minutes: 30

    services:
      # Versions and credentials mirror .env.example and docs/runbook.md §1.
      # `options.--health-cmd` is what makes the runner WAIT for the container
      # to be genuinely ready before the first step runs — no sleeps.
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdid
          POSTGRES_PASSWORD: sdid_dev
          POSTGRES_DB: sdid_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdid -d sdid_bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 5s

      redis:
        image: redis:7
        ports:
          - 6379:6379
        options: >-
          --health-cmd "redis-cli ping"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24

    env:
      # apps/broker/src/config.ts is the authoritative list; these are the
      # values the broker actually reads. Everything else keeps its default.
      NODE_ENV: test
      DATABASE_URL: postgresql://sdid:sdid_dev@localhost:5432/sdid_bridge
      REDIS_URL: redis://localhost:6379
      NID_PEPPER: dev-only-nid-pepper-change-me
      ADMIN_API_TOKEN: dev-admin-token
      SDID_STRATEGY: mock
      ATTESTATION_MODE: mock
      # BROKER_PORT / BROKER_ISSUER are deliberately NOT set: the e2e harness
      # (e2e/src/harness.ts) pins the broker it spawns to port 3199 and sets a
      # matching issuer itself. Setting them here would fight that.

    steps:
      - uses: actions/checkout@v4

      # pnpm first, so setup-node's pnpm cache has a pnpm to ask about the
      # store path. The version is NOT pinned here on purpose: the action
      # reads `packageManager: pnpm@10.33.0` from package.json, and passing
      # both a `version:` input and that field makes the action error out.
      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      # `redis-cli` is not on the runner image. The e2e harness uses it to
      # clear the per-NID enrolment rate-limit windows between runs
      # (5 enrolments/NID/hour, docs/runbook.md §7) and silently degrades
      # without it, which shows up later as a flaky enrolment failure.
      # `psql` ships with the runner but is checked, not assumed.
      - name: Install Postgres and Redis client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends redis-tools postgresql-client
          psql --version
          redis-cli --version

      # The service containers are already health-gated by the runner; this
      # re-checks from inside the job (the health check runs in the container's
      # own network namespace, this one goes through the published port) and
      # leaves a diagnostic in the log if the mapping is wrong.
      - name: Wait for Postgres and Redis on the published ports
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U sdid -d sdid_bridge >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"; break
            fi
            if [ "$i" -eq 30 ]; then echo "postgres never became ready"; exit 1; fi
            sleep 2
          done
          for i in $(seq 1 30); do
            if [ "$(redis-cli -h localhost -p 6379 ping 2>/dev/null)" = "PONG" ]; then
              echo "redis ready after ${i} attempt(s)"; break
            fi
            if [ "$i" -eq 30 ]; then echo "redis never became ready"; exit 1; fi
            sleep 2
          done
          psql "$DATABASE_URL" -qtAX -c "select version();"

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Typecheck
        run: pnpm typecheck

      - name: Build
        run: pnpm build

      # The broker also runs migrations at boot, but running them explicitly
      # first makes a migration failure a clearly attributable red step rather
      # than a mysterious e2e timeout.
      - name: Apply migrations
        run: pnpm db:migrate

      # `pnpm test` is `turbo run test`, which covers every workspace package
      # INCLUDING `e2e` (the ghost-login suite) — that package's test script is
      # `vitest run --passWithNoTests` over e2e/src/ghost-login.spec.ts.
      #
      # Kept identical to the command README.md documents. If this ever flakes:
      # turbo runs independent package tasks concurrently, and the broker suite
      # and the e2e suite share one Postgres and one Redis (the e2e harness
      # clears `rl:enrol:*` globally, which a broker rate-limit test could be
      # relying on). `pnpm test -- --concurrency=1` serialises them.
      # `pnpm test` pins turbo to --concurrency=1 on purpose. The broker suite
      # and the e2e ghost-login suite both drive the SAME Postgres and Redis,
      # and the broker suite's cleanup deletes citizen/pairwise rows. Run in
      # parallel, that cleanup can delete the login_hint the e2e suite
      # provisioned, and bc-authorize then fails mid-run with unknown_user_id.
      # It passed locally by scheduling luck and failed here — serialise it.
      - name: Test (all packages, including the e2e ghost-login suite)
        run: pnpm test

      # Smoke test: the narrated demo is the spec's first milestone (09 §6) and
      # exercises the whole trust chain. Exit 0 is the contract.
      - name: Smoke test — pnpm demo:ghost-login must exit 0
        run: |
          if pnpm demo:ghost-login; then
            echo "::notice::ghost-login demo exited 0"
          else
            rc=$?
            echo "::error::ghost-login demo exited ${rc} (expected 0)"
            exit "$rc"
          fi

  # ---------------------------------------------------------------------------
  # Schema integrity. Separate job so it gets a genuinely EMPTY database that
  # no test has touched, and so its audit probe row (which deliberately breaks
  # the hash chain) can never contaminate the suite in `verify`.
  # ---------------------------------------------------------------------------
  db-integrity:
    name: migrations + audit append-only
    runs-on: ubuntu-latest
    timeout-minutes: 20

    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: sdid
          POSTGRES_PASSWORD: sdid_dev
          POSTGRES_DB: sdid_bridge
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U sdid -d sdid_bridge"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 24
          --health-start-period 5s

    env:
      NODE_ENV: test
      DATABASE_URL: postgresql://sdid:sdid_dev@localhost:5432/sdid_bridge

    steps:
      - uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - uses: actions/setup-node@v7
        with:
          node-version: '22'
          cache: pnpm

      - name: Install Postgres client tools
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends postgresql-client
          psql --version

      - name: Wait for Postgres
        run: |
          for i in $(seq 1 30); do
            if pg_isready -h localhost -p 5432 -U sdid -d sdid_bridge >/dev/null 2>&1; then
              echo "postgres ready after ${i} attempt(s)"; break
            fi
            if [ "$i" -eq 30 ]; then echo "postgres never became ready"; exit 1; fi
            sleep 2
          done

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # apps/broker/package.json's db:migrate compiles first, which needs the
      # workspace packages it imports to be built.
      - name: Build
        run: pnpm build

      - name: Confirm the database is empty before migrating
        run: |
          tables=$(psql "$DATABASE_URL" -qtAX -c \
            "select count(*) from information_schema.tables where table_schema='public'")
          echo "public tables before migrating: ${tables}"
          if [ "${tables}" != "0" ]; then
            echo "::error::the db-integrity job expects a pristine database"
            exit 1
          fi

      # This is the real production path: the same forward-only runner that
      # apps/broker/src/main.ts calls at boot (docs/runbook.md §3).
      - name: Migrations apply cleanly to an empty database
        run: |
          # tee, not $(...): the shell here is `bash -eo pipefail`, so a failing
          # migration must still print its error before the step goes red.
          pnpm db:migrate 2>&1 | tee migrate-1.log
          grep -q "Applied:" migrate-1.log || {
            echo "::error::expected the runner to report applied migrations"; exit 1; }

      - name: Migrations are idempotent (second run is a no-op)
        run: |
          pnpm db:migrate 2>&1 | tee migrate-2.log
          grep -q "Already up to date" migrate-2.log || {
            echo "::error::re-running migrations was not a no-op — forward-only migrations must be re-runnable"
            exit 1; }

      - name: Every migration file is recorded in _migrations
        run: |
          on_disk=$(ls apps/broker/migrations/*.sql | wc -l | tr -d ' ')
          recorded=$(psql "$DATABASE_URL" -qtAX -c "select count(*) from _migrations")
          echo "on disk: ${on_disk}, recorded: ${recorded}"
          [ "${on_disk}" = "${recorded}" ] || {
            echo "::error::migration files on disk and rows in _migrations disagree"; exit 1; }

      # SPEC 07 §4 is a non-negotiable, and a trigger that exists in a .sql file
      # is not the same thing as a trigger that rejects an UPDATE. This proves
      # the latter against a real Postgres 16.
      - name: Audit trail is append-only at the database level
        run: bash .github/scripts/check-audit-append-only.sh
